<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リンク変更のお知らせ</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .notice {
      text-align: center;
      background: #fff;
      padding: 32px 40px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .notice p {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .notice a {
      font-size: 20px;
      color: #0645ad;
      text-decoration: underline;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="notice">
    <p>リンクが変わりました。新しいリンクはこちらです。</p>
    <a href="https://linienbusarchiv.de/location/fukusima">
      linienbusarchiv.de/location/fukusima
    </a>
  </div>
</body>
</html>
